# Signature updates several times a day (D-013: stale signatures stop scanning).
# Logs go to the container output via the image's own start-up script.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Checks 12
# Tell clamd to load new signatures as soon as they arrive.
NotifyClamd /etc/clamav/clamd.conf
