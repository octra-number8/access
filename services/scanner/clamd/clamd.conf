# clamd for Octra Access (D-013). Limits sit just above the 20 MB upload limit (P2-6).
# Anything clamd cannot fully scan is reported (AlertExceedsMax) and treated as rejected.
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav

StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 10
MaxFiles 1000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxScriptNormalize 5M
PCREMatchLimit 100000
PCRERecMatchLimit 2000
AlertExceedsMax yes

ScanPDF yes
ScanArchive yes
ScanHTML yes
ScanOLE2 yes
AlertEncrypted yes
AlertBrokenExecutables yes
HeuristicAlerts yes

# Backstop: re-check the signature database every 5 minutes.
SelfCheck 300
